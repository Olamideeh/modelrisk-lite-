services:
  postgres:
    image: postgres:16-alpine
    container_name: modelrisk-postgres

    environment:
      POSTGRES_DB: modelrisk_db
      POSTGRES_USER: modelrisk_user
      POSTGRES_PASSWORD: modelrisk_password

    ports:
      - "5437:5432"

    volumes:
      - modelrisk_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U modelrisk_user -d modelrisk_db
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: modelrisk-adminer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8086:8080"

  ai-model:
    build:
      context: ./ml-model
      dockerfile: Dockerfile

    container_name: modelrisk-ai-model
    restart: unless-stopped

    ports:
      - "8090:8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: modelrisk-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      ai-model:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/modelrisk_db
      DB_USERNAME: modelrisk_user
      DB_PASSWORD: modelrisk_password
      JWT_SECRET: modelrisk-docker-jwt-secret-change-this-123456789
      JWT_EXPIRATION_MINUTES: 60
      PORT: 8081

    ports:
      - "8081:8081"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:8081/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  modelrisk_postgres_data: