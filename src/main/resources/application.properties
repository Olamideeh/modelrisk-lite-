spring.application.name=modelrisk

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/modelrisk_db}
spring.datasource.username=${DB_USERNAME:modelrisk_user}
spring.datasource.password=${DB_PASSWORD:modelrisk_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway will be enabled after the first schema is finalized.
spring.flyway.enabled=false

server.port=${PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
modelrisk.jwt.secret=${JWT_SECRET:modelrisk-local-jwt-secret-change-this-123456789}
modelrisk.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}